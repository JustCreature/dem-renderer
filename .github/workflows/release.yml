name: Rust Release

on:
  push:
    tags:
      - '*.*.*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Gate the release on the Cargo.toml version matching the tag. The launcher UI version
  # is derived from the tag at build time (DEM_RENDERER_RELEASE_VERSION below → build.rs →
  # APP_VERSION_LINE), so this single check keeps Cargo.toml, the tag, and the UI in lockstep.
  # Assumes bare-semver tags (e.g. 0.2.2), matching the `*.*.*` trigger above.
  verify-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cargo.toml version must equal the release tag
      shell: bash
      run: |
        tag="${{ github.ref_name }}"
        tag="${tag#v}"
        cargo_ver=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
        echo "tag=$tag  Cargo.toml=$cargo_ver"
        if [ "$tag" != "$cargo_ver" ]; then
          echo "::error::Release tag '$tag' does not match Cargo.toml version '$cargo_ver'. Bump the version in Cargo.toml to match the tag before releasing."
          exit 1
        fi

  build-and-release:
    needs: verify-version
    runs-on: ${{ matrix.os }}

    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      DEM_RENDERER_RELEASE_VERSION: ${{ github.ref_name }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_prefix: dem_renderer_linux_x86_64
            binary_name: dem_renderer
            ext: ""
            rustflags: "-C target-cpu=x86-64-v3"
            
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_prefix: dem_renderer_apple_arm
            binary_name: dem_renderer
            ext: ""
            rustflags: ""
            
          # Swapped macos-13 to macos-latest, but building for the Intel target
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_prefix: dem_renderer_apple_darwin_x86_64
            binary_name: dem_renderer
            ext: ""
            rustflags: ""
            
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_prefix: dem_renderer_win_x86_64
            binary_name: dem_renderer.exe
            ext: ".exe"
            rustflags: "-C target-cpu=x86-64-v3"

    steps:
    - uses: actions/checkout@v4
    
    # 1. Download the toolchain for the specific target architecture
    - name: Install Rust toolchain target
      run: rustup target add ${{ matrix.target }}
    
    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    # 1. Install cargo-bundle on Mac AND Linux
    - name: Install Cargo Bundle
      if: runner.os == 'macOS' || runner.os == 'Linux'
      run: cargo install cargo-bundle

    # Install create-dmg only on Mac
    - name: Install Mac Tools
      if: runner.os == 'macOS'
      run: brew install create-dmg
    
    # 2. Standard build for Windows only
    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cargo build --release --target ${{ matrix.target }} --verbose

    # 3. Bundle build for Mac and Linux
    - name: Build and Bundle (Mac & Linux)
      if: runner.os == 'macOS' || runner.os == 'Linux'
      run: cargo bundle --release --target ${{ matrix.target }}
      
    # Run tests natively (we omit the --target flag here so the Intel cross-compile job just tests the code on the native ARM runner, avoiding Rosetta 2 emulator quirks)
    - name: Run tests
      run: cargo test  --workspace --verbose
      
    # 4. Package everything securely
    - name: Package Executables
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "macOS" ]; then
          cd target/${{ matrix.target }}/release/bundle/osx/

          # 1. Apply a free ad-hoc signature to the .app bundle
          codesign --force --deep --sign - dem_renderer.app

          # 2. Create the .dmg
          create-dmg \
            --volname "dem_renderer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "../../../../../${{ matrix.asset_prefix }}_v${{ github.ref_name }}.dmg" \
            "dem_renderer.app/"
            
        elif [ "${{ runner.os }}" == "Linux" ]; then
          # Grab the .deb package generated by cargo-bundle
          mv target/${{ matrix.target }}/release/bundle/deb/*.deb ./${{ matrix.asset_prefix }}_v${{ github.ref_name }}.deb
          
        else
          # Just move and rename the raw .exe for Windows
          mv target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.asset_prefix }}_v${{ github.ref_name }}${{ matrix.ext }}
        fi
        
    - name: Create Draft Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        draft: true
        # The wildcard catches the .exe, the Mac .dmg, or the Linux .deb file
        files: ./${{ matrix.asset_prefix }}_v${{ github.ref_name }}*
